kind = "web"
previewPath = "/"
title = "AdPlay AI Creator Portfolio"
description = "A dark, editorial portfolio site for AdPlay, an AI-powered creative studio building intelligent web templates and premium digital experiences."
version = "1.0.0"
id = "artifacts/adplay-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25657

[services.development]
run = "pnpm --filter @workspace/adplay-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adplay-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/adplay-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25657"
BASE_PATH = "/"
